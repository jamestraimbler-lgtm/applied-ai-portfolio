name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-marketplace/source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/ai-marketplace/source/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          trap 'rm -rf "$scanner_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --log-opts="--all --full-history" \
            --redact=100 --no-banner --ignore-gitleaks-allow

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify examples, tests and documentation
        run: python scripts/verify.py
