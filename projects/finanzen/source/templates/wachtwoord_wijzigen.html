{% extends "base.html" %}
{% block title %}Wachtwoord wijzigen — FinanZen{% endblock %}
{% block content %}
<div class="page-toolbar">
  <div class="toolbar-left">
    <a href="{{ url_for('instellingen') }}" class="terug-link">← Instellingen</a>
    <h1>Wachtwoord wijzigen</h1>
  </div>
</div>
<div class="blok" style="max-width:480px">
  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in msgs %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post" class="formulier">
    <label>Huidig wachtwoord <input type="password" name="huidig" required autofocus></label>
    <label>Nieuw wachtwoord (minimaal 8 tekens) <input type="password" name="nieuw" required minlength="8"></label>
    <label>Nieuw wachtwoord herhalen <input type="password" name="nieuw2" required minlength="8"></label>
    <div class="form-acties">
      <button type="submit" class="btn-primary">Wachtwoord wijzigen</button>
      <a href="{{ url_for('instellingen') }}" class="btn-secondary">Annuleren</a>
    </div>
  </form>
</div>
{% endblock %}
