<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinanZen{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% if session.get('logged_in') %}
<header class="app-header">
  <div class="header-links">
    <span class="app-logo">FinanZen</span>
    <nav>
      <a href="{{ url_for('dossiers') }}"    class="{% if request.endpoint=='dossiers' or request.endpoint=='dossier_detail' %}active{% endif %}">Dossiers</a>
      <a href="{{ url_for('hypotheek') }}"  class="{% if request.endpoint=='hypotheek' %}active{% endif %}">Hypotheek</a>
      <a href="{{ url_for('logboek') }}"     class="{% if request.endpoint=='logboek' %}active{% endif %}">Logboek</a>
      <a href="{{ url_for('instellingen') }}" class="{% if 'instellingen' in request.endpoint or 'wachtwoord' in request.endpoint %}active{% endif %}">Instellingen</a>
    </nav>
  </div>
  <div class="header-right">
    <span class="lock-timer" id="lockTimer" title="Resterend tot autovergrendeling"></span>
    <a href="{{ url_for('uitloggen') }}" class="btn-uitloggen">Vergrendelen</a>
  </div>
</header>
{% endif %}

<main class="main-content">
  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in msgs %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
