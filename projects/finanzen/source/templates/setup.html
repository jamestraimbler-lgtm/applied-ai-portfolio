<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>FinanZen — Eerste start</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">FinanZen</div>
  <h2>Welkom — eerste keer instellen</h2>
  <p class="login-intro">Kies een wachtwoord van minimaal 8 tekens. Dit wachtwoord beveiligt alle klantdata en de versleutelde back-ups.</p>

  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in msgs %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}

  <form method="post">
    <label>Wachtwoord
      <input type="password" name="wachtwoord" autofocus required minlength="8">
    </label>
    <label>Wachtwoord herhalen
      <input type="password" name="wachtwoord2" required minlength="8">
    </label>
    <button type="submit" class="btn-primary btn-block">Wachtwoord instellen</button>
  </form>
</div>
</body>
</html>
