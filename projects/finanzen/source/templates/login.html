<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>FinanZen — Inloggen</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">FinanZen</div>
  <h2>Inloggen</h2>
  <p class="login-intro">Voer uw wachtwoord in om de applicatie te ontgrendelen.</p>

  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in msgs %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}

  <form method="post">
    <label>Wachtwoord
      <input type="password" name="wachtwoord" autofocus required>
    </label>
    <button type="submit" class="btn-primary btn-block">Ontgrendelen</button>
  </form>
  <p class="login-footer">Alle klantdata blijft volledig lokaal op deze computer.</p>
</div>
</body>
</html>
